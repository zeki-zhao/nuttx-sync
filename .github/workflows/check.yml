name: Check

on:
  pull_request:
    paths-ignore:
      - 'Documentation/**'

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout nuttx repo
      # =========================
      - name: Checkout nuttx repo
        uses: actions/checkout@v6
        with:
          repository: apache/nuttx
          path: nuttx
          fetch-depth: 0

      # =========================
      # 2. Get PR changed files (FIXED: JSON array output)
      # =========================
      - name: Get PR changed files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              }
            );

            const filenames = files
              .map(f => f.filename)
              .filter(Boolean);

            console.log("Changed files:");
            console.log(filenames.join("\n"));

            // IMPORTANT: return JSON array (NOT string)
            return JSON.stringify(filenames);

      # =========================
      # 3. Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # =========================
      # 4. Check Pull Request (FIXED parsing + ARG_MAX safe)
      # =========================
      - name: Check Pull Request
        run: |
          set -e

          echo "::add-matcher::nuttx/.github/nxstyle.json"

          python3 -m venv .venv
          source .venv/bin/activate

          pip install codespell cmake-format black isort flake8 cvt2utf

          cd nuttx

          chmod +x tools/checkpatch.sh

          FILES='${{ steps.files.outputs.result }}'

          echo "Changed files:"
          echo "$FILES"

          breaking_opts=""
          if echo '${{ toJSON(github.event.pull_request.labels) }}' | jq -e 'any(.[].name; test("breaking change"; "i"))' >/dev/null 2>&1; then
            breaking_opts="-b"
          fi

          # =========================
          # FIX: safe parsing + no ARG_MAX
          # =========================
          echo "$FILES" | jq -r '.[]' | while read -r file; do
            [ -z "$file" ] && continue
            echo "checking: $file"
            ./tools/checkpatch.sh -c -u -m -g $breaking_opts "$file"
          done